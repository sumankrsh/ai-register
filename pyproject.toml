[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-register"
version = "0.1.0"
description = "Scan a codebase for AI usage and keep a reviewable register for EU AI Act and ISO/IEC 42001 work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suman Mukherjee" }]
requires-python = ">=3.11"
keywords = ["ai-governance", "eu-ai-act", "iso-42001", "ai-inventory", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ai-register = "ai_register.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_register"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long regexes and the HTML template read better unwrapped; `ruff format` handles code layout.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
